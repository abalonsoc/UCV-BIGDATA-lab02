[build-system]
requires = [
    "setuptools",
]
build-backend = "setuptools.build_meta"

[project]
requires-python = ">=3.10"
name = "laboratorio3_kedro"
version = "0.1.0"
readme = "README.md"
dependencies = [
    "ipython>=8.10",
    "jupyterlab>=3.0",
    "notebook",
    "kedro~=1.6.0",
]

[project.scripts]
laboratorio3-kedro = "laboratorio3_kedro.__main__:main"

[project.entry-points."kedro.hooks"]

[tool.setuptools.packages.find]
where = [
    "src",
]
namespaces = false

[tool.kedro]
package_name = "laboratorio3_kedro"
project_name = "laboratorio3_kedro"
kedro_init_version = "1.6.0"
tools = "['None']"
example_pipeline = "False"
source_dir = "src"
[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)"
]
